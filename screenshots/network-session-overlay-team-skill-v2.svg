    <text x="20" y="188" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#8fb8d8">SESSION</text>
    <text x="372" y="188" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#8fb8d8">7 games</text>

    <text x="20" y="224" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#39ff14">5W</text>
    <text x="78" y="224" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#53636e">-</text>
    <text x="108" y="224" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#ff2d55">2L</text>
    <text x="372" y="215" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#8fb8d8">WIN RATE</text>
    <text x="372" y="238" text-anchor="end" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#00c8ff">71%</text>

