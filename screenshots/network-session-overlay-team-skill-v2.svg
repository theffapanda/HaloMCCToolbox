    <text x="20" y="123" font-family="Consolas, monospace" font-size="12" fill="#8fb8d8">42 packets/s</text>
    <text x="372" y="123" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#8fb8d8">96 packets/s</text>
