    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#02080d" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <rect width="760" height="420" fill="#12181d"/>
  <g opacity="0.22">
